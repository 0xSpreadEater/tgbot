[project]
name = "bebop-bot"
version = "0.1.0"
description = "Single-user Telegram bot for curated X (Twitter) roundups, emerging tokens, and (later) airdrop opportunities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27",
    "anthropic>=0.40",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
bebop-bot = "bebop_bot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bebop_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
